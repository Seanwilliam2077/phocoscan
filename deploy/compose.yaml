name: shijing

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /var/lib/pocketworld/data
      POCKETWORLD_CONFIG: /var/lib/pocketworld/.local-config.json
    volumes:
      - pocketworld:/var/lib/pocketworld
    # No published app port. Only Caddy can reach it on this private network.
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set a real DNS hostname in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - edge

volumes:
  pocketworld:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
